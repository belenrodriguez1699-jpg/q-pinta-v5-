<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f35a8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Q' Pinta"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Q' Pinta V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f7f4fa;--card:#fff;--ink:#251f29;--muted:#746d78;--a:#6f35a8;--a2:#51227e;--al:#eee5f5;--bd:#e3dce8;--ok:#21864d;--danger:#b52b2b;--warn:#9b6500}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:var(--a);color:#fff}.secondary{background:var(--al);color:#58346d}.danger{background:#fde6e6;color:#ad2929}.success{background:#e4f5e9;color:#176c3b}.ghost{background:#f4f1f5;color:#4f4654}.muted{color:var(--muted)}.hidden{display:none!important}header{background:linear-gradient(135deg,var(--a2),#7c46a9);color:#fff;padding:17px 16px 15px;position:sticky;top:0;z-index:20}header h1{margin:0;font-size:22px}header small{opacity:.88}.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px}.userbar button{background:#fff;color:#5a3270}nav{display:flex;gap:7px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);padding:10px;position:sticky;top:91px;z-index:19}nav button{white-space:nowrap;background:#f0ecf3;color:#57346b}nav button.active{background:var(--a);color:#fff}main{max-width:1100px;margin:auto;padding:15px}.view{display:none}.view.active{display:block}h2{font-size:20px;margin:8px 0 14px}h3{margin:8px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:17px;padding:15px;box-shadow:0 2px 8px #3b1b4d08}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:25px;font-weight:900;margin-top:4px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.field{flex:1;min-width:150px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #d6cdda;border-radius:11px;background:#fff;color:var(--ink)}.section{margin-top:13px}.notice{padding:12px;border-radius:13px;background:#fff5df;border:1px solid #efd59f}.low{background:#fde5e5;color:#a62424}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.prod{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px;text-align:left;min-height:108px}.prod strong{display:block;line-height:1.15}.prod .price{font-size:19px;font-weight:900;margin-top:7px}.prod small{color:var(--muted)}.cart{position:relative}.cart-sticky{position:sticky;top:150px}.summaryline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee;align-items:center}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:6px 10px}.total{font-size:28px;font-weight:950;text-align:right;margin:13px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid var(--bd);font-size:13px;text-align:left;vertical-align:top}th{background:#f1edf4}.empty{text-align:center;padding:25px;color:var(--muted)}.auth{min-height:82vh;display:grid;place-items:center;padding:20px}.auth .card{width:min(430px,100%)}.toast{position:fixed;right:15px;bottom:15px;background:#241e28;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:50;max-width:90vw}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:40}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;padding:17px;width:min(560px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#eee}.scanbox{width:100%;min-height:250px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button.active{background:var(--a);color:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.promo{border:1px solid var(--bd);border-radius:15px;padding:13px;background:#fff}.promo .promo-price{font-size:23px;font-weight:900}.checkrow{display:flex;align-items:center;gap:8px;padding:6px 0}.checkrow input{width:auto}.bar{height:9px;border-radius:9px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.stock-kpi{min-height:118px}.stock-kpi .value{font-size:30px}.traffic{display:inline-flex;align-items:center;gap:7px;font-weight:850}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.dot.green{background:#21864d}.dot.yellow{background:#d6a300}.dot.red{background:#c22d2d}.stock-row{border-left:5px solid #d8d1dc}.stock-row.green{border-left-color:#21864d}.stock-row.yellow{border-left-color:#d6a300}.stock-row.red{border-left-color:#c22d2d}.filterbar{display:flex;gap:8px;overflow:auto;margin:12px 0}.filterbar button{white-space:nowrap}.mini{font-size:12px}.cash-movement-ingreso{color:#176c3b}.cash-movement-egreso{color:#ad2929}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.product-grid{grid-template-columns:repeat(2,1fr)}.cart-sticky{position:static}.two,.three{grid-template-columns:1fr 1fr}}
@media(max-width:520px){main{padding:11px}.grid{grid-template-columns:1fr 1fr}.product-grid{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}nav{top:89px}.prod{min-height:102px;padding:11px}}
</style></head>
<body>
<header><h1>🥤 Q' Pinta V5</h1><small>Ventas · stock · caja · reportes · promociones</small><div id="userbar" class="userbar hidden"></div></header>
<div id="auth" class="auth"><div class="card"><h2>🔐 Ingresar a Q' Pinta</h2><p class="muted">Usá tu cuenta de Supabase para acceder.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="tu@email.com"></div><div class="field section"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><div class="row section"><button class="primary" onclick="signIn()">Iniciar sesión</button></div><p id="authMsg" class="muted"></p></div></div>
<div id="app" class="hidden"><nav id="nav"></nav><main><section id="home" class="view"></section><section id="sales" class="view"></section><section id="products" class="view"></section><section id="restock" class="view"></section><section id="cash" class="view"></section><section id="reports" class="view"></section><section id="promos" class="view"></section></main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Q' Pinta</h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://meheicxcgimpcdcvkfpm.supabase.co';
const SUPABASE_KEY='sb_publishable_WK0q5MVegj96NWCPktHhcA_HvKI87Fc';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,profilesData=[],productsData=[],cart=[],cashSessions=[],activeCash=null,currentView='home',reportMode='month',scanReader=null,stockFilter='all';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Math.round(Number(n)||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',3000)};
const isAdmin=()=>currentProfile?.role==='admin';
function authMsg(t){document.getElementById('authMsg').textContent=t}
async function signIn(){let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return authMsg('Completá email y contraseña.');authMsg('Ingresando…');let {data,error}=await db.auth.signInWithPassword({email,password});if(error)return authMsg(error.message);await enterApp(data.user)}
async function signOut(){await db.auth.signOut();location.reload()}
async function enterApp(user){currentUser=user;let {data:p,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)return authMsg('No se pudo cargar tu perfil: '+error.message);currentProfile=p||{id:user.id,email:user.email,full_name:user.email?.split('@')[0],role:'vendedor'};document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userbar').classList.remove('hidden');document.getElementById('userbar').innerHTML='<span>👤 '+esc(currentProfile.full_name||user.email)+' · '+(isAdmin()?'ADMINISTRADOR':'VENDEDOR')+'</span><button onclick="signOut()">Salir</button>';renderNav();await loadProfiles();await loadProducts();await loadCash();go('home')}
function renderNav(){let items=[['home','🏠 Inicio'],['sales','🛒 Ventas'],['products','📦 Stock'],['cash','💰 Caja']];if(isAdmin())items.push(['restock','🔴 Reposición'],['reports','📊 Reportes'],['promos','🎁 Promos']);document.getElementById('nav').innerHTML=items.map(([v,t])=>`<button data-v="${v}" onclick="go('${v}')">${t}</button>`).join('')}
async function loadProfiles(){let {data,error}=await db.from('profiles').select('id,full_name,email,role').order('full_name');if(error)return toast('Error de usuarios: '+error.message);profilesData=data||[]}
const profileName=id=>{let p=profilesData.find(x=>x.id===id);return p?.full_name||p?.email||'Usuario';}
async function loadProducts(){let {data,error}=await db.from('products').select(isAdmin()?'*':'id,name,section,subcategory,category,barcode,sale_price,stock,min_stock,active,cost').eq('active',true).order('name');if(error)return toast('Error de productos: '+error.message);productsData=data||[]}
async function loadCash(){let {data,error}=await db.from('cash_sessions').select('*').order('opened_at',{ascending:false}).limit(30);if(error)return toast('Error de caja: '+error.message);cashSessions=data||[];activeCash=cashSessions.find(x=>!x.closed_at)||null}
function go(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));renderCurrent()}
async function renderCurrent(){if(currentView==='home')return home();if(currentView==='sales')return sales();if(currentView==='products')return stock();if(currentView==='restock')return restock();if(currentView==='cash')return cash();if(currentView==='reports')return reports();if(currentView==='promos')return promos()}
async function refresh(){await loadProducts();await loadCash();await renderCurrent()}
async function home(){let today=new Date();let start=new Date(today.getFullYear(),today.getMonth(),today.getDate()).toISOString();let {data:sales,error}=await db.from('sales').select('*').gte('sold_at',start).order('sold_at',{ascending:false});if(error)return toast(error.message);let ss=(sales||[]).filter(s=>s.status!=='annulled'),t=ss.reduce((a,s)=>a+Number(s.total),0),c=ss.reduce((a,s)=>a+Number(s.total_cost),0),low=productsData.filter(p=>Number(p.stock)<=Number(p.min_stock??4));document.getElementById('home').innerHTML=`<div class="row" style="justify-content:space-between"><h2>Resumen de hoy</h2><button class="primary" onclick="go('sales')">＋ Registrar venta</button></div><div class="grid"><div class="card kpi"><div class="label">Ventas</div><div class="value">${money(t)}</div></div><div class="card kpi"><div class="label">Costo vendido</div><div class="value">${money(c)}</div></div><div class="card kpi"><div class="label">Ganancia bruta</div><div class="value">${money(t-c)}</div></div><div class="card kpi"><div class="label">Operaciones</div><div class="value">${ss.length}</div></div></div><div class="card section"><h3>⚠️ Stock bajo</h3>${low.length?low.map(p=>`<div class="summaryline"><span>${esc(p.name)}</span><span class="badge low">${p.stock} unidades</span></div>`).join(''):'<div class="empty">No hay alertas. El mínimo configurado es 4 unidades por producto.</div>'}</div>${activeCash?`<div class="notice section">💰 <b>Caja abierta:</b> turno ${activeCash.shift==='manana'?'mañana':'tarde'} · fondo ${money(activeCash.opening_cash)}. <button class="secondary" onclick="go('cash')">Ver caja</button></div>`:`<div class="notice section">💰 No hay una caja abierta. Abrí el turno antes de registrar ventas.</div>`}`}
async function sales(){
  let q=window.saleQuery||'',section=window.saleSection||'Todas',sub=window.saleSub||'Todas';
  let filtered=productsData.filter(p=>{
    let hay=!q||p.name.toLowerCase().includes(q.toLowerCase())||(p.barcode||'').includes(q);
    let sec=section==='Todas'||(p.section||p.category||'Bebidas')===section;
    let ss=sub==='Todas'||(p.subcategory||'')===sub;
    return hay&&sec&&ss;
  });
  let sections=['Todas',...new Set(productsData.map(p=>p.section||'Bebidas').filter(Boolean))];
  let subs=section==='Bebidas'?['Todas','Con alcohol','Sin alcohol']:[...new Set(productsData.filter(p=>(p.section||'Bebidas')===section).map(p=>p.subcategory).filter(Boolean))];
  let cartHtml=cart.length?cart.map((i,idx)=>`<div class="summaryline"><span><b>${esc(i.name)}</b><br><small>${money(i.price)} c/u</small></span><span class="qty"><button class="ghost" onclick="changeQty(${idx},-1)">−</button><b>${i.qty}</b><button class="ghost" onclick="changeQty(${idx},1)">＋</button><button class="danger" onclick="removeCart(${idx})">✕</button></span><b>${money(i.price*i.qty)}</b></div>`).join(''):'<div class="empty">El carrito está vacío.</div>';
  let total=cart.reduce((a,i)=>a+i.price*i.qty,0);
  let promoData=[]; if(isAdmin()||currentProfile){let r=await db.from('promotions').select('*').eq('active',true).lte('starts_at',new Date().toISOString()).or(`ends_at.is.null,ends_at.gte.${new Date().toISOString()}`).order('created_at',{ascending:false}); if(!r.error) promoData=r.data||[];}
  let promoIds=promoData.map(p=>p.id), promoItems=[]; if(promoIds.length){let r=await db.from('promotion_items').select('promotion_id,product_id,quantity').in('promotion_id',promoIds);if(!r.error)promoItems=r.data||[]}
  let promoNames=Object.fromEntries(promoItems.map(i=>[i.promotion_id,(promoNames?.[i.promotion_id]||'')]));
  let promoCards=promoData.map(p=>{let its=promoItems.filter(i=>i.promotion_id===p.id).map(i=>{let pr=productsData.find(x=>x.id===i.product_id);return `${i.quantity}× ${esc(pr?.name||'')}`}).join(' + ');return `<button class="promo" onclick="sellPromo('${p.id}')" style="text-align:left"><b>🎁 ${esc(p.name)}</b><br><small>${its}</small><div class="promo-price">${money(p.price)}</div><small>Tocar para vender</small></button>`}).join('');
  document.getElementById('sales').innerHTML=`<h2>🛒 Registrar venta</h2><div class="card cart"><div class="row"><div class="field"><label>Buscar por nombre o código</label><input value="${esc(q)}" oninput="window.saleQuery=this.value;sales()" placeholder="Ej. Fernet o código de barras"></div><button class="primary" onclick="openScanner()">📷 Escanear</button></div><div class="tabs section">${sections.map(c=>`<button class="${c===section?'active':''}" onclick="window.saleSection='${esc(c)}';window.saleSub='Todas';sales()">${esc(c)}</button>`).join('')}</div>${section==='Bebidas'||subs.length>1?`<div class="tabs">${subs.map(c=>`<button class="${c===sub?'active':''}" onclick="window.saleSub='${esc(c)}';sales()">${esc(c)}</button>`).join('')}</div>`:''}<h3>🧾 Venta actual</h3>${cartHtml}<div class="total">TOTAL: ${money(total)}</div>${cart.length?`<div class="row"><div class="field"><label>Medio de pago</label><select id="pay" onchange="toggleHybridPayment()"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="debito">Débito</option><option value="credito">Crédito</option><option value="otro">Otro</option><option value="mixto">🔀 Mixto / Híbrido</option></select></div><button class="primary" onclick="confirmSale()">✓ Confirmar venta</button><button class="danger" onclick="cart=[];sales()">Vaciar</button></div><div id="hybridBox" class="notice section hidden"><b>🔀 Pago mixto</b><p class="muted mini">Distribuí el total entre dos o más medios.</p><div class="three"><div class="field"><label>Efectivo</label><input id="hy_efectivo" type="number" min="0" value="0" oninput="updateHybridRemaining()"></div><div class="field"><label>Transferencia</label><input id="hy_transferencia" type="number" min="0" value="0" oninput="updateHybridRemaining()"></div><div class="field"><label>Débito</label><input id="hy_debito" type="number" min="0" value="0" oninput="updateHybridRemaining()"></div><div class="field"><label>Crédito</label><input id="hy_credito" type="number" min="0" value="0" oninput="updateHybridRemaining()"></div><div class="field"><label>Otro</label><input id="hy_otro" type="number" min="0" value="0" oninput="updateHybridRemaining()"></div><div class="field"><label>Falta cubrir</label><input id="hy_remaining" readonly value="${total}"></div></div></div>`:''}</div><div class="card section"><h3>🎁 Promociones disponibles</h3>${promoCards||'<div class="empty">No hay promociones activas en este momento.</div>'}</div><h3 class="section">Productos</h3><div class="product-grid">${filtered.map(p=>`<button class="prod" onclick="addCart('${p.id}')" ${p.stock<=0?'disabled':''}><strong>${esc(p.name)}</strong><small>${esc(p.subcategory||p.category||p.section||'')}</small><div class="price">${money(p.sale_price)}</div><small>Stock: ${p.stock}</small></button>`).join('')||'<div class="empty">No hay productos para esa búsqueda.</div>'}</div>`
}

function toggleHybridPayment(){let box=document.getElementById('hybridBox');if(box)box.classList.toggle('hidden',document.getElementById('pay').value!=='mixto')}
function updateHybridRemaining(){let total=cart.reduce((a,i)=>a+i.price*i.qty,0),sum=['efectivo','transferencia','debito','credito','otro'].reduce((a,k)=>a+(Number(document.getElementById('hy_'+k)?.value)||0),0);let el=document.getElementById('hy_remaining');if(el){el.value=Math.round(total-sum);el.style.color=Math.abs(total-sum)<0.01?'#176c3b':'#ad2929'}}

function addCart(id){let p=productsData.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Sin stock');let i=cart.findIndex(x=>x.id===id);if(i>=0){if(cart[i].qty>=p.stock)return toast('No hay más stock disponible');cart[i].qty++}else cart.push({id:p.id,name:p.name,price:Number(p.sale_price),qty:1,stock:p.stock});sales()}
function changeQty(i,d){let x=cart[i],p=productsData.find(p=>p.id===x.id);x.qty+=d;if(x.qty<=0)cart.splice(i,1);else if(x.qty>p.stock)x.qty=p.stock;sales()}
function removeCart(i){cart.splice(i,1);sales()}
async function confirmSale(){if(!activeCash)return toast('Primero abrí una caja para el turno.');if(!cart.length)return;let pay=document.getElementById('pay').value;let notes=null;if(pay==='mixto'){let total=cart.reduce((a,i)=>a+i.price*i.qty,0),parts={efectivo:Number(document.getElementById('hy_efectivo')?.value)||0,transferencia:Number(document.getElementById('hy_transferencia')?.value)||0,debito:Number(document.getElementById('hy_debito')?.value)||0,credito:Number(document.getElementById('hy_credito')?.value)||0,otro:Number(document.getElementById('hy_otro')?.value)||0};let sum=Object.values(parts).reduce((a,v)=>a+v,0);if(Math.abs(sum-total)>0.01)return toast('El pago mixto no coincide con el total. Faltan/sobran '+money(total-sum));notes=JSON.stringify(parts)}let items=cart.map(i=>({product_id:i.id,quantity:i.qty}));let {data:saleId,error}=await db.rpc('create_sale_for_session',{p_session_id:activeCash.id,p_payment_method:pay,p_items:items,p_notes:notes});if(error){console.error(error);return toast('No se pudo registrar: '+(error.message||error.details||'Error desconocido'));}if(!saleId)return toast('La venta no devolvió un ID. Revisemos la conexión.');cart=[];await refresh();toast('✅ Venta registrada')}
async function openScanner(){if(!window.Html5Qrcode)return toast('No se cargó el lector.');openModal('Escanear código de barras','<div id="reader" class="scanbox"></div><p class="muted">Permití el acceso a la cámara. Si tu iPhone no permite cámara, escribí el código en el buscador.</p>');try{scanReader=new Html5Qrcode('reader');await scanReader.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:140}},code=>{document.getElementById('sales').querySelector('input')?.focus();window.saleQuery=code;closeModal();sales();let p=productsData.find(x=>(x.barcode||'')===code);if(p)addCart(p.id);else toast('Código leído: '+code+'. Cargalo en Stock si todavía no está asociado.')},()=>{})}catch(e){toast('No se pudo abrir la cámara: '+e.message)}}
async function closeScanner(){if(scanReader){try{await scanReader.stop()}catch(e){}try{await scanReader.clear()}catch(e){}scanReader=null}}
function stock(){
  let min4=productsData.filter(p=>Number(p.stock)<=4), noStock=productsData.filter(p=>Number(p.stock)<=0);
  let statusOf=p=>{let st=Number(p.stock),min=Math.max(1,Number(p.min_stock??4));if(st<=min)return 'red';if(st<min*2)return 'yellow';return 'green'};
  let filtered=productsData.filter(p=>stockFilter==='all'||(stockFilter==='red'&&statusOf(p)==='red')||(stockFilter==='yellow'&&statusOf(p)==='yellow')||(stockFilter==='green'&&statusOf(p)==='green')||(stockFilter==='zero'&&Number(p.stock)<=0));
  document.getElementById('products').innerHTML=`<div class="row" style="justify-content:space-between"><h2>📦 Stock</h2>${isAdmin()?'<button class="primary" onclick="editProduct()">＋ Nuevo producto</button>':''}</div>

async function reports(){if(!isAdmin())return;let {data:sales,error}=await db.from('sales').select('*').order('sold_at',{ascending:false});if(error)return toast(error.message);let ss=(sales||[]),now=new Date(),key=reportMode==='today'?now.toISOString().slice(0,10):reportMode==='year'?String(now.getFullYear()):now.toISOString().slice(0,7);let active=ss.filter(s=>s.status!=='annulled');let filtered=active.filter(s=>reportMode==='today'?s.sold_at.slice(0,10)===key:reportMode==='year'?s.sold_at.slice(0,4)===key:s.sold_at.slice(0,7)===key);let total=a=>a.reduce((x,s)=>x+Number(s.total),0),cost=a=>a.reduce((x,s)=>x+Number(s.total_cost),0);let byPay={};filtered.forEach(s=>{if(s.payment_method==='mixto'){try{let x=JSON.parse(s.notes||'{}');Object.entries(x).forEach(([k,v])=>{if(Number(v)>0)byPay[k]=(byPay[k]||0)+Number(v)})}catch(e){byPay.mixto=(byPay.mixto||0)+Number(s.total)}}else byPay[s.payment_method]=(byPay[s.payment_method]||0)+Number(s.total)});let bySeller={};filtered.forEach(s=>{let n=profileName(s.created_by);bySeller[n]=(bySeller[n]||0)+Number(s.total)});let ids=filtered.map(s=>s.id);let {data:items}=ids.length?await db.from('sale_items').select('sale_id,product_id,quantity,subtotal').in('sale_id',ids):{data:[]};let map={};(items||[]).forEach(i=>{map[i.product_id]=(map[i.product_id]||0)+Number(i.quantity)});let names=Object.fromEntries(productsData.map(p=>[p.id,p.name]));let top=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);document.getElementById('reports').innerHTML=`<h2>📊 Reportes</h2><div class="tabs">${[['today','Hoy'],['month','Mes'],['year','Año']].map(([k,t])=>`<button class="${reportMode===k?'active':''}" onclick="reportMode='${k}';reports()">${t}</button>`).join('')}</div><div class="grid"><div class="card kpi"><div class="label">Ventas</div><div class="value">${money(total(filtered))}</div></div><div class="card kpi"><div class="label">Costos</div><div class="value">${money(cost(filtered))}</div></div><div class="card kpi"><div class="label">Ganancia</div><div class="value">${money(total(filtered)-cost(filtered))}</div></div><div class="card kpi"><div class="label">Operaciones</div><div class="value">${filtered.length}</div></div></div><div class="two section"><div class="card"><h3>Por medio de pago</h3>${Object.entries(byPay).map(([k,v])=>`<div class="summaryline"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">Sin ventas.</div>'}</div><div class="card"><h3>Por vendedor</h3>${Object.entries(bySeller).map(([k,v])=>`<div class="summaryline"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">Sin ventas.</div>'}</div></div><div class="card section"><h3>Productos más vendidos</h3>${top.map(([id,q])=>`<div class="summaryline"><span>${esc(names[id]||id)}</span><b>${q} u.</b></div>`).join('')||'<div class="empty">Sin ventas.</div>'}</div><div class="card section"><h3>Ventas anuladas</h3><div class="summaryline"><span>Cantidad en el período</span><b>${ss.filter(s=>s.status==='annulled'&&(reportMode==='today'?s.sold_at.slice(0,10)===key:reportMode==='year'?s.sold_at.slice(0,4)===key:s.sold_at.slice(0,7)===key)).length}</b></div><small class="muted">Las anuladas no suman ventas, costos ni ganancias.</small></div>`}
async function promos(){if(!isAdmin())return;let {data:promosData,error}=await db.from('promotions').select('*').order('created_at',{ascending:false});if(error)return toast('No se pudieron cargar las promos: '+error.message);let ids=(promosData||[]).map(p=>p.id);let itemData=[];if(ids.length){let r=await db.from('promotion_items').select('promotion_id,product_id,quantity').in('promotion_id',ids);if(r.error)return toast('No se pudieron cargar los productos de las promos: '+r.error.message);itemData=r.data||[]}let byPromo={};itemData.forEach(i=>(byPromo[i.promotion_id]??=[]).push(i));let now=new Date();document.getElementById('promos').innerHTML=`<div class="row" style="justify-content:space-between"><h2>🎁 Promociones</h2><button class="primary" onclick="newPromo()">＋ Crear promo</button></div><div class="notice">Las promociones se guardan por separado de las ventas. Si creás una para hoy, aparece inmediatamente acá y podés editarla o desactivarla.</div><div class="section">${(promosData||[]).map(p=>{let items=(byPromo[p.id]||[]).map(i=>{let pr=productsData.find(x=>x.id===i.product_id);return `${i.quantity}× ${esc(pr?.name||i.product_id)}`}).join(' + ');let live=p.active&&new Date(p.starts_at)<=now&&(!p.ends_at||new Date(p.ends_at)>=now);let state=!p.active?'Desactivada':live?'Activa':new Date(p.starts_at)>now?'Programada':'Vencida';return `<div class="promo section"><div class="row" style="justify-content:space-between"><b>${esc(p.name)}</b><span class="badge ${live?'success':'ghost'}">${state}</span></div><p class="muted">${items||'Sin productos asociados'}</p><div class="row"><span class="promo-price">${money(p.price)}</span><button class="secondary" onclick="editPromo('${p.id}')">Editar</button>${p.active?`<button class="danger" onclick="deactivatePromo('${p.id}')">Desactivar</button>`:''}${live?`<button class="primary" onclick="sellPromo('${p.id}')">Vender promo</button>`:''}</div></div>`}).join('')||'<div class="empty">No hay promociones creadas.</div>'}</div>`}
function promoForm(p={name:'',price:0,starts_at:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16),ends_at:'',items:[]}){let itemMap=Object.fromEntries((p.items||[]).map(i=>[i.product_id,i.quantity]));return `<div class="field"><label>Nombre</label><input id="prn" value="${esc(p.name)}" placeholder="Ej. Fernet + Coca hoy"></div><div class="field section"><label>Precio promo</label><input id="prp" type="number" min="1" value="${Number(p.price)||0}"></div><div class="two section"><div class="field"><label>Desde</label><input id="prs" type="datetime-local" value="${p.starts_at?new Date(p.starts_at).toISOString().slice(0,16):''}"></div><div class="field"><label>Hasta (opcional)</label><input id="pre" type="datetime-local" value="${p.ends_at?new Date(p.ends_at).toISOString().slice(0,16):''}"></div></div><h3 class="section">Productos y cantidades</h3><div>${productsData.map(x=>`<div class="checkrow"><input type="checkbox" class="pi" value="${x.id}" ${itemMap[x.id]?'checked':''}><span style="flex:1">${esc(x.name)}</span><input id="qty_${x.id}" type="number" min="1" value="${itemMap[x.id]||1}" style="width:75px"></div>`).join('')}</div><button class="primary section" onclick="savePromoForm('${p.id||''}')">Guardar promo</button>`}
function newPromo(){openModal('Crear promoción',promoForm())}
async function editPromo(id){let {data,error}=await db.from('promotions').select('*').eq('id',id).single();if(error)return toast(error.message);let r=await db.from('promotion_items').select('product_id,quantity').eq('promotion_id',id);if(r.error)return toast(r.error.message);openModal('Editar promoción',promoForm({id:data.id,name:data.name,price:data.price,starts_at:data.starts_at,ends_at:data.ends_at,items:r.data||[]}))}
async function savePromoForm(id){let name=document.getElementById('prn').value.trim(),price=Number(document.getElementById('prp').value)||0,starts=document.getElementById('prs').value?new Date(document.getElementById('prs').value).toISOString():new Date().toISOString(),ends=document.getElementById('pre').value?new Date(document.getElementById('pre').value).toISOString():null,checks=[...document.querySelectorAll('.pi:checked')];if(!name||price<=0||!checks.length)return toast('Completá nombre, precio y productos');let payload={name,price,starts_at:starts,ends_at:ends,active:true};let data,error;if(id){({data,error}=await db.from('promotions').update(payload).eq('id',id).select().single());if(error)return toast(error.message);let d=await db.from('promotion_items').delete().eq('promotion_id',id);if(d.error)return toast(d.error.message)}else{({data,error}=await db.from('promotions').insert({...payload,created_by:currentUser.id}).select().single());if(error)return toast(error.message);id=data.id}let rows=checks.map(c=>({promotion_id:id,product_id:c.value,quantity:Math.max(1,Number(document.getElementById('qty_'+c.value).value)||1)}));let r=await db.from('promotion_items').insert(rows);if(r.error)return toast(r.error.message);closeModal();await promos();toast(id?'✅ Promo actualizada':'✅ Promo creada')}
async function deactivatePromo(id){if(!confirm('¿Desactivar esta promo?'))return;let {error}=await db.from('promotions').update({active:false}).eq('id',id);if(error)return toast(error.message);promos()}

async function sellPromo(id){if(!activeCash)return toast('Primero abrí una caja.');openModal('Vender promoción',`<div class=\"field\"><label>Medio de pago</label><select id=\"promoPay\" onchange=\"togglePromoHybrid()\"><option value=\"efectivo\">Efectivo</option><option value=\"transferencia\">Transferencia</option><option value=\"debito\">Débito</option><option value=\"credito\">Crédito</option><option value=\"otro\">Otro</option><option value=\"mixto\">🔀 Mixto / Híbrido</option></select></div><div id=\"promoHybrid\" class=\"notice section hidden\"><b>🔀 Pago mixto</b><div class=\"three section\"><div class=\"field\"><label>Efectivo</label><input id=\"ph_efectivo\" type=\"number\" min=\"0\" value=\"0\"></div><div class=\"field\"><label>Transferencia</label><input id=\"ph_transferencia\" type=\"number\" min=\"0\" value=\"0\"></div><div class=\"field\"><label>Débito</label><input id=\"ph_debito\" type=\"number\" min=\"0\" value=\"0\"></div><div class=\"field\"><label>Crédito</label><input id=\"ph_credito\" type=\"number\" min=\"0\" value=\"0\"></div><div class=\"field\"><label>Otro</label><input id=\"ph_otro\" type=\"number\" min=\"0\" value=\"0\"></div></div></div><button class=\"primary section\" onclick=\"confirmPromoSale('${id}')\">✓ Confirmar promo</button>`)}
function togglePromoHybrid(){document.getElementById('promoHybrid')?.classList.toggle('hidden',document.getElementById('promoPay').value!=='mixto')}
async function confirmPromoSale(id){let pay=document.getElementById('promoPay').value,notes=null;if(pay==='mixto'){let parts={efectivo:Number(document.getElementById('ph_efectivo')?.value)||0,transferencia:Number(document.getElementById('ph_transferencia')?.value)||0,debito:Number(document.getElementById('ph_debito')?.value)||0,credito:Number(document.getElementById('ph_credito')?.value)||0,otro:Number(document.getElementById('ph_otro')?.value)||0};notes=JSON.stringify(parts)}let {error}=await db.rpc('create_promo_sale_for_session',{p_session_id:activeCash.id,p_payment_method:pay,p_promotion_id:id,p_notes:notes});if(error)return toast(error.message);closeModal();await refresh();toast('✅ Promo vendida y stock actualizado')}
function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('open')}
async function closeModal(){await closeScanner();document.getElementById('modal').classList.remove('open')}
db.auth.getSession().then(({data})=>{if(data.session)enterApp(data.session.user)});db.auth.onAuthStateChange((_e,s)=>{if(!s){currentUser=null;currentProfile=null;document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden')}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
